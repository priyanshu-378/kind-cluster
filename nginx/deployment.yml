kind: Deployment
apiVersion: apps/v1
metadata:
  name: nginx-deployment
  namespace: nginx
spec:
  replicas: 2
  selector: 
    matchLabels: 
      app: nginx
  template: 
    metadata: 
      name: nginx-pod-deployment
      labels:
        app: nginx
    spec: 
      containers:
        - name: nginx
          image: nginx
          ports:
            - containerPort: 80
          volumeMounts:
            - name: local-pv
              mountPath: /var/www/html
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 256Mi    

      volumes:
        - name: local-pv
          persistentVolumeClaim:
            claimName: kub-pvc
            
