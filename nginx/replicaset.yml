kind: ReplicaSet
apiVersion: apps/v1
metadata:
  name: nginx-replicasets
  namespace: nginx
spec:
  replicas: 2
  selector: 
    matchLabels: 
      app: nginx
  template: 
    metadata: 
      name: nginx-pod-replicasets
      labels:
        app: nginx
    spec: 
      containers:
        - name: nginx
          image: nginx
          ports:
            - containerPort: 80    
