kind: DaemonSet
apiVersion: apps/v1
metadata:
  name: nginx-daemonset
  namespace: nginx
spec:
  selector: 
    matchLabels: 
      app: nginx
  template: 
    metadata: 
      name: nginx-pod-daemonset
      labels:
        app: nginx
    spec: 
      containers:
        - name: nginx
          image: nginx
          ports:
            - containerPort: 80    
