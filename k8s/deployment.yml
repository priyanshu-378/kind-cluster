kind: Deployment
apiVersion: apps/v1
metadata: 
  name: django-deployment
  namespace: django
spec:
  selector:
    matchLabels:
      app: django-label
  replicas: 2
  template:
    metadata: 
      labels:
        app: django-label
    spec:
      containers:
        - name: dajngo-cont
          image: 378priyanshu/django-app-k8s    
          ports: 
            - containerPort: 8000
          resources:
            requests: 
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 256Mi  
          livenessProbe:
            httpGet:
              path: /
              port: 8000
          readinessProbe:
            httpGet:
              path: /
              port: 8000    
