kind: HorizontalPodAutoscaler
apiVersion: autoscaling/v2
metadata:
  name: django-hpa
  namespace: django
spec:
  scaleTargetRef:
    kind: Deployment
    name: django-deployment
    apiVersion: apps/v1
  
  minReplicas: 1
  maxReplicas: 5

  metrics: 
    - type: Resource
      resource:
        name: cpu
        target: 
          type: Utilization
          averageUtilization: 5  
