kind: Ingress
apiVersion: networking.k8s.io/v1
metadata:
  name: ingress-service
  namespace: nginx
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  rules:
    - http:
        paths:
          - pathType: Prefix
            path: /nginx
            backend:
              service:
                name: service-useable
                port:
                  number: 80
          - pathType: Prefix
            path: /
            backend:
              service: 
                name: django-service
                port: 
                  number: 8000



